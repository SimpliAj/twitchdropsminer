name: windows-build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'src/desktop/**'
      - 'src/config/paths.py'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/windows/requirements.txt

      - name: Build
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Smoke test the built executable
        shell: pwsh
        run: |
          $env:TDM_DATA_DIR = Join-Path $env:RUNNER_TEMP "tdm-smoke"
          $env:TDM_PORT = "18080"
          $proc = Start-Process -FilePath "dist\TwitchDropsMiner\TwitchDropsMiner.exe" -ArgumentList "--no-tray","--no-browser" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18080/healthz" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The packaged app did not start serving /healthz" }

      - name: Login window opens in Edge and Chrome
        shell: pwsh
        run: .build-venv\Scripts\python.exe packaging\windows\edge_probe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwitchDropsMiner-windows-x64
          path: dist/TwitchDropsMiner-*-windows-x64.zip


  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TwitchDropsMiner-windows-x64
          path: dist
      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # scripts/release.sh pushes the tag before it creates the release
          for i in $(seq 1 30); do gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" dist/TwitchDropsMiner-*-windows-x64.zip -R "$REPO" --clobber
